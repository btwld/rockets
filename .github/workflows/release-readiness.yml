name: release-readiness

# Gate-only: ci-pr-test already runs build/lint/typecheck/unit/e2e on every
# pull request. This workflow adds only the release gates it does not cover.
on:
  # Runs on every pull request, including stacked ones — the Firestore emulator
  # suite is the only gate for the Admin SDK path, so skipping it on non-main
  # bases meant those claims shipped unverified.
  pull_request:
  push:
    branches: ['main']

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          # The published floor (`engines`), exactly — the example apps and the
          # packed consumer prove the release on it.
          node-version: 20.19.0
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          # Keyed to the pinned firebase-tools version in
          # scripts/run-emulator-suite.mjs — bump together.
          key: firestore-emulator-${{ runner.os }}-firebase-tools-15.15.0
      - name: Install
        run: corepack yarn install --immutable
      - name: Build
        run: corepack yarn build
      - name: Package artifacts and clean-consumer contracts
        run: corepack yarn release:packages
      - name: Firestore emulator suite
        run: corepack yarn test:firestore-emulator
      - name: Samples build
        run: corepack yarn samples:build
      - name: Samples e2e
        run: corepack yarn samples:test:e2e
