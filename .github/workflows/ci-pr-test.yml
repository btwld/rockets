name: ci-pr-test

on:
  # No base-branch filter: stacked PRs (branch → branch → main) must be gated
  # too. Filtering on 'main' left them with zero checks.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # Each leg is a separate claim (the floor, the current LTS); one
      # failing must not cancel the other's evidence or its artifacts.
      fail-fast: false
      matrix:
        # 20.19.0 is the published minimum (`engines`): the CommonJS build
        # needs `require(esm)` for the ESM Nest 12 line, so the floor runs the
        # unit + package e2e suites here (the example apps run in
        # release-readiness on the same floor). `@nestjs/core` is preloaded in the test
        # runner (vitest.setup.preload-nest-core.mts) because a CommonJS
        # require of the still-evaluating ESM module throws on 20.19.
        node-version: [20.19.0, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/cache@v4
        with:
          # Relative paths: '/node_modules' never exists and
          # hashFiles('/yarn.lock') hashes nothing, so the cache was
          # silently dead and every run cold-installed.
          path: node_modules
          key: ${{ runner.os }}-node${{ matrix.node-version }}-modules-${{ hashFiles('yarn.lock') }}

      - name: Install
        run: yarn --immutable
      - name: Build
        run: yarn build
      - name: Public API reports
        run: yarn api:report:check-built
      - name: Linting
        run: yarn lint:all
      - name: Typecheck tests
        run: yarn typecheck:spec
      - name: Verify native Vitest config loading
        # Loads `vitest.config.mts` straight into Node, which needs native
        # TypeScript stripping (Node 22+). A repo-tooling check, not part of
        # the published packages' floor — the 20.19.0 leg covers build and
        # the unit + package e2e suites (the packed-consumer contract runs in
        # release-readiness on the same floor).
        if: matrix.node-version == '22.x'
        run: yarn test:config-native
      - name: Unit tests
        run: yarn test:ci
      - name: E2E coverage
        run: yarn test:e2e:cov
      - name: Save the PR number in an artifact
        shell: bash
        env:
          PR_NUM: ${{ github.event.number }}
        run: |
          echo $PR_NUM > ./pr_num.txt
      - name: Upload test-results artifact
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results-${{ matrix.node-version }}
          path: |
            pr_num.txt
            junit.xml
            coverage/lcov.info
            coverage/coverage-final.json
            coverage-e2e/lcov.info
            coverage-e2e/coverage-final.json
