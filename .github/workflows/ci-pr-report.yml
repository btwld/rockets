name: ci-pr-report
on:
  workflow_run:
    workflows: ['ci-pr-test']
    types:
      - completed
jobs:
  test-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Process Test Results
        uses: dorny/test-reporter@v1
        with:
          # The Node 22 leg's results: both matrix legs upload, one report.
          artifact: test-results-22.x
          name: Tests
          path: 'junit.xml'
          reporter: java-junit
  coverage-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results-22.x
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Get PR Number
        id: vars
        run: echo "pr_num=$(cat pr_num.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload to Codecov
        uses: codecov/codecov-action@v2
        with:
          files: ${{ github.workspace }}/coverage/coverage-final.json,${{ github.workspace }}/coverage-e2e/coverage-final.json
          override_pr: ${{ steps.vars.outputs.pr_num }}
          verbose: true
      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ github.workspace }}/coverage/lcov.info,${{ github.workspace }}/coverage-e2e/lcov.info
